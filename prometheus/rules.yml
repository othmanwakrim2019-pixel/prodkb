groups:
  - name: prodkb_alerts
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Instance {{ $labels.instance }} down"
          description: "{{ $labels.instance }} of job {{ $labels.job }} has been down for more than 1 minute."

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP Error Rate"
          description: "Over 5% of requests are returning 5xx errors across 5 minutes."

      - alert: SLAWorkerDown
        expr: up{job="prodkb-sla-worker"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "SLA Worker node is offline"
          description: "The BullMQ worker processing SLAs has dropped offline for > 1m."
