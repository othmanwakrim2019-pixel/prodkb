app = "prodkb-backend"
primary_region = "cdg" # Paris - change this to your preferred region

[build]
  dockerfile = "Dockerfile"

[processes]
  api = "node dist/src/server.js"
  sla = "node dist/src/workers/sla.worker.js"
  webhook = "node dist/src/workers/webhook.worker.js"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["api"] # Only the API process handles HTTP traffic

[[services]]
  internal_port = 3002
  protocol = "tcp"
  processes = ["api"]
  [[services.ports]]
    port = 3002

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
