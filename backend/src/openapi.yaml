openapi: 3.0.0
info:
  title: ProdKB API
  description: API documentation for ProdKB Incident Management System
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local Development Server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Incident:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        severity:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        status:
          type: string
          enum: [Open, In Progress, Resolved, Closed]
        environment:
          type: string
        systemId:
          type: string
        sysout:
          type: string
    
    System:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
    
    EmailTemplate:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        subject:
          type: string
        body:
          type: string
        variables:
          type: string

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      summary: Login user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Successful login
        '401':
          description: Invalid credentials
        '403':
          description: Account deactivated
  
  /auth/me:
    get:
      summary: Get current user profile
      tags: [Auth]
      responses:
        '200':
          description: User profile returned
  
  /api/incidents:
    get:
      summary: List incidents
      tags: [Incidents]
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: severity
          schema:
            type: string
      responses:
        '200':
          description: List of incidents
    post:
      summary: Create new incident
      tags: [Incidents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Incident'
      responses:
        '201':
          description: Incident created

  /api/incidents/{id}:
    get:
      summary: Get incident details
      tags: [Incidents]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Incident details
    put:
      summary: Update incident
      tags: [Incidents]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Incident updated
    delete:
      summary: Delete incident
      tags: [Incidents]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Incident deleted

  /api/incidents/{id}/status:
    put:
      summary: Update incident status
      tags: [Incidents]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
      responses:
        '200':
          description: Status updated

  /api/systems:
    get:
      summary: List all systems
      tags: [Systems]
      responses:
        '200':
          description: List of systems
    post:
      summary: Create system
      tags: [Systems]
      responses:
        '201':
          description: System created

  /api/jobs:
    get:
      summary: List all jobs
      tags: [Jobs]
      responses:
        '200':
          description: List of jobs
    post:
      summary: Create job
      tags: [Jobs]
      responses:
        '201':
          description: Job created

  /api/teams:
    get:
      summary: List all teams
      tags: [Teams]
      responses:
        '200':
          description: List of teams
    post:
      summary: Create team
      tags: [Teams]
      responses:
        '201':
          description: Team created

  /api/slas:
    get:
      summary: List all SLAs
      tags: [SLAs]
      responses:
        '200':
          description: List of SLAs

  /api/procedures:
    get:
      summary: Search procedures
      tags: [Procedures]
      responses:
        '200':
          description: List of procedures
    post:
      summary: Create procedure
      tags: [Procedures]
      responses:
        '201':
          description: Procedure created

  /api/email-templates:
    get:
      summary: Get email templates
      tags: [Settings]
      responses:
        '200':
          description: List of templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmailTemplate'

  /api/email-templates/{id}:
    put:
      summary: Update email template
      tags: [Settings]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                subject:
                  type: string
                body:
                  type: string
      responses:
        '200':
          description: Template updated

  /api/config/smtp:
    get:
      summary: Get SMTP configuration
      tags: [Settings]
      responses:
        '200':
          description: SMTP config
    put:
      summary: Update SMTP configuration
      tags: [Settings]
      responses:
        '200':
          description: Config updated

  /api/audit-logs:
    get:
      summary: Get audit logs
      tags: [Audit]
      responses:
        '200':
          description: List of audit logs
