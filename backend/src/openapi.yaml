      tags: [Planning]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, startDate, endDate]
              properties:
                name:
                  type: string
                startDate:
                  type: string
                  format: date-time
                endDate:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Planning instance created

  /api/v1/planning/instances/{id}:
    get:
      summary: Get planning instance details
      tags: [Planning]
      parameters:
        - in: path
