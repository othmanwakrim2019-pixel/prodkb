      responses:
        '200':
          description: List of jobs in this instance

  /api/v1/planning/jobs:
    post:
      summary: Create a planning job
      tags: [Planning]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instanceId, jobId]
              properties:
                instanceId:
                  type: string
                jobId:
                  type: string
                position:
                  type: integer
      responses:
        '201':
          description: Planning job created

  /api/v1/planning/jobs/{id}:
    put:
      summary: Update a planning job
      tags: [Planning]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                position:
                  type: integer
      responses:
        '200':
          description: Planning job updated
    delete:
      summary: Delete a planning job
      tags: [Planning]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Planning job deleted

  /api/v1/planning/jobs/{id}/status:
    patch:
      summary: Update planning job status
      tags: [Planning]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
      responses:
        '200':
          description: Job status updated

  /api/v1/planning/jobs/{id}/complete:
    patch:
