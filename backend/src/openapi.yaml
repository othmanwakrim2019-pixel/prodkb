openapi: 3.0.0
info:
  title: ProdKB API
  description: |
    API documentation for ProdKB Incident Management System.
    All `/api/v1/*` endpoints require Bearer JWT authentication unless otherwise noted.
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local Development Server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Incident:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        severity:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        status:
          type: string
          enum: [Open, In Progress, Acknowledged, Resolved, Closed]
        environment:
          type: string
        systemId:
          type: string
        sysout:
          type: string
        assignedToId:
          type: string
        createdById:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    System:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string

    EmailTemplate:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        subject:
          type: string
        body:
          type: string
        variables:
          type: string
        enabled:
          type: boolean
        cc:
          type: string

    Job:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        code:
          type: string
        systemId:
          type: string
        teamId:
          type: string

    Team:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        emailDistribution:
          type: string
        isActive:
          type: boolean
        sendEmail:
          type: boolean

    SLA:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        severity:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        acknowledgeTimeMinutes:
          type: integer
        resolveTimeMinutes:
          type: integer

    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        roleId:
          type: string
        isActive:
          type: boolean

    Role:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string

    Permission:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        description:
          type: string

    AuditLog:
      type: object
      properties:
        id:
          type: string
        actionType:
          type: string
        entityType:
          type: string
        entityId:
          type: string
        userId:
          type: string
        details:
          type: string
        timestamp:
          type: string
          format: date-time

    Procedure:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        content:
          type: string
        systemId:
          type: string

    AutoAssignmentRule:
      type: object
      properties:
        id:
          type: string
        systemId:
          type: string
        severity:
          type: string
        assignToUserId:
          type: string
        teamId:
          type: string
        isActive:
          type: boolean

    EscalationRule:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        severity:
          type: string
        triggerAfterMinutes:
          type: integer
        escalateToUserId:
          type: string
        isActive:
          type: boolean

    Webhook:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
        events:
          type: string
        isActive:
          type: boolean
        secret:
          type: string

    PlanningInstance:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        status:
          type: string
        isArchived:
          type: boolean

    PlanningJob:
      type: object
      properties:
        id:
          type: string
        instanceId:
          type: string
        jobId:
          type: string
        status:
          type: string
        position:
          type: integer

    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
        message:
          type: string

security:
  - bearerAuth: []

paths:
  # ═══════════════════════════════════════════
  # Health Check
  # ═══════════════════════════════════════════
  /health:
    get:
      summary: Health check
      tags: [System]
      security: []
      responses:
        '200':
          description: Server is healthy

  # ═══════════════════════════════════════════
  # Authentication
  # ═══════════════════════════════════════════
  /auth/login:
    post:
      summary: Login user
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Successful login — returns JWT token and user info
        '401':
          description: Invalid credentials
        '403':
          description: Account deactivated

  /auth/me:
    get:
      summary: Get current user profile
      tags: [Auth]
      responses:
        '200':
          description: Authenticated user profile returned
        '401':
          description: Not authenticated

  /auth/register:
    post:
      summary: Register new user (Admin only)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, role]
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                role:
                  type: string
      responses:
        '201':
          description: User registered successfully

  # ═══════════════════════════════════════════
  # Incidents
  # ═══════════════════════════════════════════
  /api/v1/incidents:
    get:
      summary: List incidents (paginated)
      tags: [Incidents]
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
          description: Items per page
        - in: query
          name: search
          schema:
            type: string
          description: Search term (filters by title/description)
        - in: query
          name: status
          schema:
            type: string
            enum: [Open, In Progress, Acknowledged, Resolved, Closed]
          description: Filter by status
        - in: query
          name: severity
          schema:
            type: string
            enum: [LOW, MEDIUM, HIGH, CRITICAL]
          description: Filter by severity
        - in: query
          name: systemId
          schema:
            type: string
          description: Filter by system ID
        - in: query
          name: assignedToId
          schema:
            type: string
          description: Filter by assigned user
        - in: query
          name: sortBy
          schema:
            type: string
          description: Sort field
        - in: query
          name: sortOrder
          schema:
            type: string
            enum: [asc, desc]
          description: Sort direction
      responses:
        '200':
          description: Paginated list of incidents
    post:
      summary: Create new incident
      tags: [Incidents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, severity, systemId]
              properties:
                title:
                  type: string
                description:
                  type: string
                severity:
                  type: string
                  enum: [LOW, MEDIUM, HIGH, CRITICAL]
                environment:
                  type: string
                systemId:
                  type: string
                sysout:
                  type: string
                assignedToId:
                  type: string
      responses:
        '201':
          description: Incident created

  /api/v1/incidents/stats:
    get:
      summary: Get incident statistics for dashboard
      tags: [Incidents]
      parameters:
        - in: query
          name: days
          schema:
            type: integer
            default: 30
          description: Number of days for trend data
      responses:
        '200':
          description: Statistics returned (createdToday, resolvedToday, activeIncidents, avgResolutionTime, trend, topSystems)

  /api/v1/incidents/search:
    get:
      summary: Search similar incidents
      tags: [Incidents]
      parameters:
        - in: query
          name: query
          required: true
          schema:
            type: string
          description: Search query string
      responses:
        '200':
          description: Search results

  /api/v1/incidents/{id}:
    get:
      summary: Get incident details
      tags: [Incidents]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Incident details with logs, files, and linked procedures
        '404':
          description: Incident not found
    put:
      summary: Update incident
      tags: [Incidents]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                severity:
                  type: string
                environment:
                  type: string
                assignedToId:
                  type: string
                sysout:
                  type: string
      responses:
        '200':
          description: Incident updated
    delete:
      summary: Delete incident
      tags: [Incidents]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Incident deleted

  /api/v1/incidents/{id}/status:
    put:
      summary: Update incident status
      tags: [Incidents]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [Open, In Progress, Acknowledged, Resolved, Closed]
                notes:
                  type: string
      responses:
        '200':
          description: Status updated

  /api/v1/incidents/{id}/acknowledge:
    post:
      summary: Acknowledge an incident
      tags: [Incidents]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Incident acknowledged

  /api/v1/incidents/{id}/logs:
    post:
      summary: Add incident log entry
      tags: [Incidents]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [logType, details]
              properties:
                logType:
                  type: string
                details:
                  type: string
      responses:
        '201':
          description: Log entry added

  /api/v1/incidents/{id}/upload:
    post:
      summary: Upload file to incident
      tags: [Incidents]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Max 25MB. Allowed types — text, csv, json, xml, pdf, png, jpeg, gif, webp, zip, gzip, xlsx, docx
      responses:
        '201':
          description: File uploaded

  /api/v1/incidents/{id}/files/{filename}:
    get:
      summary: Download incident file
      tags: [Incidents]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: filename
          required: true
          schema:
            type: string
      responses:
        '200':
          description: File stream

  /api/v1/incidents/{id}/link-procedure/{procedureId}:
    post:
      summary: Link procedure to incident
      tags: [Incidents]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: procedureId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Procedure linked

  # ═══════════════════════════════════════════
  # Users
  # ═══════════════════════════════════════════
  /api/v1/users:
    get:
      summary: List all users
      tags: [Users]
      responses:
        '200':
          description: List of users

  /api/v1/users/{id}:
    put:
      summary: Update user
      tags: [Users]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                roleId:
                  type: string
                isActive:
                  type: boolean
      responses:
        '200':
          description: User updated
    delete:
      summary: Delete user
      tags: [Users]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: User deleted

  # ═══════════════════════════════════════════
  # Systems
  # ═══════════════════════════════════════════
  /api/v1/systems:
    get:
      summary: List all systems
      tags: [Systems]
      responses:
        '200':
          description: List of systems
    post:
      summary: Create system
      tags: [Systems]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: System created

  /api/v1/systems/{id}:
    put:
      summary: Update system
      tags: [Systems]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/System'
      responses:
        '200':
          description: System updated
    delete:
      summary: Delete system
      tags: [Systems]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: System deleted

  # ═══════════════════════════════════════════
  # Jobs
  # ═══════════════════════════════════════════
  /api/v1/jobs:
    get:
      summary: List all jobs
      tags: [Jobs]
      responses:
        '200':
          description: List of jobs
    post:
      summary: Create job
      tags: [Jobs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, code, systemId]
              properties:
                name:
                  type: string
                code:
                  type: string
                systemId:
                  type: string
                teamId:
                  type: string
      responses:
        '201':
          description: Job created

  /api/v1/jobs/{id}:
    put:
      summary: Update job
      tags: [Jobs]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Job'
      responses:
        '200':
          description: Job updated
    delete:
      summary: Delete job
      tags: [Jobs]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Job deleted

  # ═══════════════════════════════════════════
  # Teams
  # ═══════════════════════════════════════════
  /api/v1/teams:
    get:
      summary: List all teams
      tags: [Teams]
      responses:
        '200':
          description: List of teams
    post:
      summary: Create team
      tags: [Teams]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                description:
                  type: string
                emailDistribution:
                  type: string
                isActive:
                  type: boolean
                sendEmail:
                  type: boolean
      responses:
        '201':
          description: Team created

  /api/v1/teams/{id}:
    get:
      summary: Get team details with members
      tags: [Teams]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Team details
    put:
      summary: Update team
      tags: [Teams]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Team'
      responses:
        '200':
          description: Team updated
    delete:
      summary: Delete team
      tags: [Teams]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Team deleted

  /api/v1/teams/{id}/members:
    post:
      summary: Add team member
      tags: [Teams]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
                role:
                  type: string
                  description: Role within the team (e.g., LEAD, MEMBER)
      responses:
        '201':
          description: Member added

  /api/v1/teams/{id}/members/{userId}:
    delete:
      summary: Remove team member
      tags: [Teams]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Member removed

  # ═══════════════════════════════════════════
  # SLAs
  # ═══════════════════════════════════════════
  /api/v1/slas:
    get:
      summary: List all SLAs
      tags: [SLAs]
      responses:
        '200':
          description: List of SLAs
    post:
      summary: Create SLA
      tags: [SLAs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, severity, acknowledgeTimeMinutes, resolveTimeMinutes]
              properties:
                name:
                  type: string
                severity:
                  type: string
                  enum: [LOW, MEDIUM, HIGH, CRITICAL]
                acknowledgeTimeMinutes:
                  type: integer
                resolveTimeMinutes:
                  type: integer
      responses:
        '201':
          description: SLA created

  /api/v1/slas/{id}:
    get:
      summary: Get SLA details
      tags: [SLAs]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: SLA details
    put:
      summary: Update SLA
      tags: [SLAs]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SLA'
      responses:
        '200':
          description: SLA updated
    delete:
      summary: Delete SLA
      tags: [SLAs]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: SLA deleted

  # ═══════════════════════════════════════════
  # Procedures
  # ═══════════════════════════════════════════
  /api/v1/procedures:
    get:
      summary: List/search procedures
      tags: [Procedures]
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Search term
      responses:
        '200':
          description: List of procedures
    post:
      summary: Create procedure
      tags: [Procedures]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, content]
              properties:
                title:
                  type: string
                content:
                  type: string
                systemId:
                  type: string
      responses:
        '201':
          description: Procedure created

  /api/v1/procedures/{id}:
    get:
      summary: Get procedure details
      tags: [Procedures]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Procedure details
    put:
      summary: Update procedure
      tags: [Procedures]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Procedure'
      responses:
        '200':
          description: Procedure updated
    delete:
      summary: Delete procedure
      tags: [Procedures]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Procedure deleted

  # ═══════════════════════════════════════════
  # Roles & Permissions
  # ═══════════════════════════════════════════
  /api/v1/roles:
    get:
      summary: List all roles with permissions
      tags: [Roles]
      responses:
        '200':
          description: List of roles
    post:
      summary: Create role
      tags: [Roles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                description:
                  type: string
                permissionIds:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Role created

  /api/v1/roles/{id}:
    put:
      summary: Update role
      tags: [Roles]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                permissionIds:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Role updated
    delete:
      summary: Delete role
      tags: [Roles]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Role deleted

  /api/v1/permissions:
    get:
      summary: List all permissions
      tags: [Roles]
      responses:
        '200':
          description: List of permissions

  # ═══════════════════════════════════════════
  # Search
  # ═══════════════════════════════════════════
  /api/v1/search:
    get:
      summary: Global search across incidents, procedures, systems
      tags: [Search]
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
          description: Search query
      responses:
        '200':
          description: Search results grouped by entity type

  # ═══════════════════════════════════════════
  # Email Templates
  # ═══════════════════════════════════════════
  /api/v1/email-templates:
    get:
      summary: Get all email templates
      tags: [Settings]
      responses:
        '200':
          description: List of templates
          content:
            application/json:
              schema:
