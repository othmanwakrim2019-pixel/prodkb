openapi: 3.0.0
info:
  title: ProdKB API
  description: API documentation for ProdKB Incident Management System
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local Development Server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Incident:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        severity:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        status:
          type: string
          enum: [Open, In Progress, Resolved, Closed]
        environment:
          type: string
        systemId:
          type: string
        sysout:
          type: string
    
    System:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
    
    EmailTemplate:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        subject:
          type: string
        body:
          type: string
        variables:
          type: string

    Job:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        code:
          type: string
        systemId:
          type: string
        teamId:
          type: string
    
    Team:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        emailDistribution:
          type: string
        isActive:
          type: boolean
        sendEmail:
          type: boolean
    
    SLA:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        severity:
          type: string
        acknowledgeTimeMinutes:
          type: integer
        resolveTimeMinutes:
          type: integer
    
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        roleId:
          type: string
        isActive:
          type: boolean
    
    Role:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
    
    Permission:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        description:
          type: string
    
    AuditLog:
      type: object
      properties:
        id:
          type: string
        actionType:
          type: string
        entityType:
          type: string
        entityId:
          type: string
        userId:
          type: string
        details:
          type: string
        timestamp:
          type: string
          format: date-time

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      summary: Login user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Successful login
        '401':
          description: Invalid credentials
        '403':
          description: Account deactivated
  
  /auth/me:
    get:
      summary: Get current user profile
      tags: [Auth]
      responses:
        '200':
          description: User profile returned
  
  /api/incidents:
    get:
      summary: List incidents
      tags: [Incidents]
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: severity
          schema:
            type: string
      responses:
        '200':
          description: List of incidents
    post:
      summary: Create new incident
      tags: [Incidents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Incident'
      responses:
        '201':
          description: Incident created

  /api/incidents/{id}:
    get:
      summary: Get incident details
      tags: [Incidents]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Incident details
    put:
      summary: Update incident
      tags: [Incidents]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Incident updated
    delete:
      summary: Delete incident
      tags: [Incidents]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Incident deleted

  /api/incidents/{id}/status:
    put:
      summary: Update incident status
      tags: [Incidents]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
      responses:
        '200':
          description: Status updated

  /api/users:
    get:
      summary: List all users
      tags: [Users]
      responses:
        '200':
          description: List of users

  /api/users/{id}:
    put:
      summary: Update user
      tags: [Users]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: User updated
    delete:
      summary: Delete user
      tags: [Users]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: User deleted

  /api/incidents/stats:
    get:
      summary: Get incident statistics
      tags: [Incidents]
      responses:
        '200':
          description: Statistics returned

  /api/incidents/search:
    get:
      summary: Search similar incidents
      tags: [Incidents]
      parameters:
        - in: query
          name: query
          schema:
            type: string
      responses:
        '200':
          description: Search results

  /api/incidents/{id}/logs:
    post:
      summary: Add incident log
      tags: [Incidents]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                logType:
                  type: string
                details:
                  type: string
      responses:
        '201':
          description: Log added

  /api/incidents/{id}/upload:
    post:
      summary: Upload file to incident
      tags: [Incidents]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: File uploaded

  /api/incidents/{id}/files/{filename}:
    get:
      summary: Download incident file
      tags: [Incidents]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: filename
          required: true
          schema:
            type: string
      responses:
        '200':
          description: File stream

  /api/incidents/{id}/link-procedure/{procedureId}:
    post:
      summary: Link procedure to incident
      tags: [Incidents]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: procedureId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Procedure linked

  /api/systems:
    get:
      summary: List all systems
      tags: [Systems]
      responses:
        '200':
          description: List of systems
    post:
      summary: Create system
      tags: [Systems]
      responses:
        '201':
          description: System created

  /api/systems/{id}:
    put:
      summary: Update system
      tags: [Systems]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/System'
      responses:
        '200':
          description: System updated
    delete:
      summary: Delete system
      tags: [Systems]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: System deleted

  /api/jobs:
    get:
      summary: List all jobs
      tags: [Jobs]
      responses:
        '200':
          description: List of jobs
    post:
      summary: Create job
      tags: [Jobs]
      responses:
        '201':
          description: Job created

  /api/jobs/{id}:
    put:
      summary: Update job
      tags: [Jobs]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Job'
      responses:
        '200':
          description: Job updated
    delete:
      summary: Delete job
      tags: [Jobs]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Job deleted

  /api/teams:
    get:
      summary: List all teams
      tags: [Teams]
      responses:
        '200':
          description: List of teams
    post:
      summary: Create team
      tags: [Teams]
      responses:
        '201':
          description: Team created

  /api/teams/{id}:
    get:
      summary: Get team details
      tags: [Teams]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Team details
    put:
      summary: Update team
      tags: [Teams]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Team'
      responses:
        '200':
          description: Team updated
    delete:
      summary: Delete team
      tags: [Teams]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Team deleted

  /api/teams/{id}/members:
    post:
      summary: Add team member
      tags: [Teams]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                role:
                  type: string
      responses:
        '201':
          description: Member added

  /api/teams/{id}/members/{userId}:
    delete:
      summary: Remove team member
      tags: [Teams]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Member removed

  /api/slas:
    get:
      summary: List all SLAs
      tags: [SLAs]
      responses:
        '200':
          description: List of SLAs
    post:
      summary: Create SLA
      tags: [SLAs]
      responses:
        '201':
          description: SLA created

  /api/slas/{id}:
    get:
      summary: Get SLA details
      tags: [SLAs]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: SLA details
    put:
      summary: Update SLA
      tags: [SLAs]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestsBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SLA'
      responses:
        '200':
          description: SLA updated
    delete:
      summary: Delete SLA
      tags: [SLAs]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: SLA deleted

  /api/procedures:
    get:
      summary: Search procedures
      tags: [Procedures]
      responses:
        '200':
          description: List of procedures
    post:
      summary: Create procedure
      tags: [Procedures]
      responses:
        '201':
          description: Procedure created

  /api/procedures/{id}:
    get:
      summary: Get procedure details
      tags: [Procedures]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Procedure details
    put:
      summary: Update procedure
      tags: [Procedures]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Procedure updated
    delete:
      summary: Delete procedure
      tags: [Procedures]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Procedure deleted

  /api/search:
    get:
      summary: Global search
      tags: [Search]
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Search results

  /api/roles:
    get:
      summary: List all roles
      tags: [Roles]
      responses:
        '200':
          description: List of roles
    post:
      summary: Create role
      tags: [Roles]
      responses:
        '201':
          description: Role created

  /api/roles/{id}:
    put:
      summary: Update role
      tags: [Roles]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Role updated
    delete:
      summary: Delete role
      tags: [Roles]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Role deleted

  /api/permissions:
    get:
      summary: List all permissions
      tags: [Roles]
      responses:
        '200':
          description: List of permissions

  /api/email-templates:
    get:
      summary: Get email templates
      tags: [Settings]
      responses:
        '200':
          description: List of templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmailTemplate'

  /api/email-templates/{id}:
    get:
      summary: Get email template details
      tags: [Settings]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Template details
    put:
      summary: Update email template
      tags: [Settings]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                subject:
                  type: string
                body:
                  type: string
      responses:
        '200':
          description: Template updated

  /api/email-templates/preview:
    post:
      summary: Preview email template
      tags: [Settings]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                variables:
                  type: object
      responses:
        '200':
          description: Preview generated

  /api/config/smtp:
    get:
      summary: Get SMTP configuration
      tags: [Settings]
      responses:
        '200':
          description: SMTP config
    put:
      summary: Update SMTP configuration
      tags: [Settings]
      responses:
        '200':
          description: Config updated

  /api/config/smtp/test:
    post:
      summary: Test SMTP configuration
      tags: [Settings]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
      responses:
        '200':
          description: Test email sent

  /api/config/params:
    get:
      summary: Get system parameters
      tags: [Settings]
      responses:
        '200':
          description: System parameters returned

  /api/config/{key}:
    put:
      summary: Update system config
      tags: [Settings]
      parameters:
        - in: path
          name: key
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: string
      responses:
        '200':
          description: Config updated

  /api/audit-logs:
    get:
      summary: Get audit logs
      tags: [Audit]
      responses:
        '200':
          description: List of audit logs

  /auth/register:
    post:
      summary: Register new user (Admin only)
      tags: [Auth]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '201':
          description: User registered
