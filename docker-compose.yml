version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: prodkb-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prodkb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prodkb_password}
      POSTGRES_DB: ${POSTGRES_DB:-prodkb}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prodkb} -d ${POSTGRES_DB:-prodkb}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prodkb-network
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: ./backend0
      dockerfile: Dockerfile
    container_name: prodkb-backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-prodkb}:${POSTGRES_PASSWORD:-prodkb_password}@postgres:5432/${POSTGRES_DB:-prodkb}?schema=public
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_change_me_in_production}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8080}
      - NODE_ENV=${NODE_ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend-uploads:/app/uploads
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - prodkb-network
    restart: unless-stopped

  # Frontend Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # args:
      #   VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    container_name: prodkb-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - prodkb-network
    restart: unless-stopped

networks:
  prodkb-network:
    driver: bridge

volumes:
  postgres-data:
  backend-uploads:
