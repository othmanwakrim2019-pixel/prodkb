services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: prodkb-postgres
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prodkb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prodkb_password}
      POSTGRES_DB: ${POSTGRES_DB:-prodkb}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prodkb} -d ${POSTGRES_DB:-prodkb}" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - prodkb-network
    restart: unless-stopped

  # Adminer Database GUI
  adminer:
    image: adminer:latest
    container_name: prodkb-adminer
    ports:
      - "8081:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    networks:
      - prodkb-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # PgBouncer Connection Pooler
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: prodkb-pgbouncer
    environment:
      - DB_USER=${POSTGRES_USER:-prodkb}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-prodkb_password}
      - DB_HOST=postgres
      - DB_NAME=${POSTGRES_DB:-prodkb}
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=20
      - ADMIN_USERS=${POSTGRES_USER:-prodkb}
      - AUTH_TYPE=scram-sha-256
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "nc -z 127.0.0.1 5432 || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - prodkb-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: prodkb-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prodkb-network
    restart: unless-stopped

  # MinIO — S3-compatible object storage for file uploads
  minio:
    image: minio/minio:latest
    container_name: prodkb-minio
    ports:
      - "9002:9000"
      - "9001:9001" # MinIO Console
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - prodkb-network
    restart: unless-stopped

  # Auto-create the default bucket on first startup
  minio-init:
    image: minio/mc:latest
    container_name: prodkb-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
        mc mb --ignore-existing local/$${S3_BUCKET:-prodkb-uploads};
        exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-prodkb-uploads}
    networks:
      - prodkb-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prodkb-backend
    ports:
      - "3000:3000"
      - "3002:3002"
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-prodkb}:${POSTGRES_PASSWORD:-prodkb_password}@pgbouncer:5432/${POSTGRES_DB:-prodkb}?schema=public&pgbouncer=true
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET environment variable is required}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8080}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8080,http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173}
      - NODE_ENV=${NODE_ENV:-production}
      - SEED=${SEED:-false}
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # ── Security Mode ──────────────────────────────────────────────────────
      # Leave blank (or remove) for plain HTTP deployments (no SSL/domain).
      # Set to 'strict' when you have a domain + SSL certificate (HTTPS).
      # When strict: enables HSTS, CSP, Secure cookies (browser won't store
      #              cookies over plain HTTP — login will break without HTTPS).
      - SECURITY_MODE=${SECURITY_MODE:-}
      # ───────────────────────────────────────────────────────────────────────
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      # S3 / MinIO
      - S3_BUCKET=${S3_BUCKET:-prodkb-uploads}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-minioadmin}
      - S3_FORCE_PATH_STYLE=true
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - prodkb-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    restart: unless-stopped

  # SLA Enforcement Worker (BullMQ — separate process)
  sla-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prodkb-sla-worker
    command: [ "node", "dist/src/workers/sla.worker.js" ]
    healthcheck:
      disable: true
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-prodkb}:${POSTGRES_PASSWORD:-prodkb_password}@pgbouncer:5432/${POSTGRES_DB:-prodkb}?schema=public&pgbouncer=true
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET environment variable is required}
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=${NODE_ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      # S3 / MinIO
      - S3_BUCKET=${S3_BUCKET:-prodkb-uploads}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-minioadmin}
      - S3_FORCE_PATH_STYLE=true
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    networks:
      - prodkb-network
    restart: unless-stopped

  # Webhook Delivery Worker (BullMQ — separate process)
  webhook-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prodkb-webhook-worker
    command: [ "node", "dist/src/workers/webhook.worker.js" ]
    healthcheck:
      disable: true
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-prodkb}:${POSTGRES_PASSWORD:-prodkb_password}@pgbouncer:5432/${POSTGRES_DB:-prodkb}?schema=public&pgbouncer=true
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=${NODE_ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    networks:
      - prodkb-network
    restart: unless-stopped

  # Cleanup Worker (Token/Log rotation — separate process)
  cleanup-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prodkb-cleanup-worker
    command: [ "node", "dist/src/workers/cleanup.worker.js" ]
    healthcheck:
      disable: true
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-prodkb}:${POSTGRES_PASSWORD:-prodkb_password}@pgbouncer:5432/${POSTGRES_DB:-prodkb}?schema=public&pgbouncer=true
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=${NODE_ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    networks:
      - prodkb-network
    restart: unless-stopped

  # Frontend Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: prodkb-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - prodkb-network
    restart: unless-stopped

  # Loki — Log aggregation backend (receives logs from Promtail, queried by Grafana)
  loki:
    image: grafana/loki:3.4.2
    container_name: prodkb-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - prodkb-network
    restart: unless-stopped

  # Promtail — Docker log collector (scrapes container stdout/stderr → ships to Loki)
  promtail:
    image: grafana/promtail:3.4.2
    container_name: prodkb-promtail
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - prodkb-network
    restart: unless-stopped

  # PostgreSQL Exporter — scrapes pg_stat internal metrics for Prometheus
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: prodkb-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://prodkb:prodkb_password@postgres:5432/prodkb?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - prodkb-network
    restart: unless-stopped

  # Redis Exporter — scrapes Redis INFO metrics for Prometheus
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: prodkb-redis-exporter
    environment:
      REDIS_ADDR: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - prodkb-network
    restart: unless-stopped

  # Node Exporter — scrapes EC2 server hardware metrics (CPU, RAM, Disk)
  node-exporter:
    image: prom/node-exporter:latest
    container_name: prodkb-node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    networks:
      - prodkb-network
    restart: unless-stopped

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: prodkb-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml
    ports:
      - "9090:9090"
    networks:
      - prodkb-network
    restart: unless-stopped

  # Alertmanager
  alertmanager:
    image: prom/alertmanager:latest
    container_name: prodkb-alertmanager
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"
    networks:
      - prodkb-network
    restart: unless-stopped

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: prodkb-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-secretadmin}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - prodkb-network
    restart: unless-stopped

networks:
  prodkb-network:
    driver: bridge

volumes:
  postgres-data:
  minio-data:


