# ═══════════════════════════════════════════════════════════════════════════════
# ProdKB — Production Docker Compose (External PostgreSQL) — HARDENED
# ═══════════════════════════════════════════════════════════════════════════════
# Security model: SINGLE PUBLIC ENTRY POINT.
#   • Public (open in AWS Security Group):  22 (SSH), 8080 (app frontend)
#   • Everything else binds to 127.0.0.1 only → reachable on the server itself
#     and via SSH tunnel, NEVER from the internet.
#
# Reach a private tool from your laptop, e.g. Grafana:
#   ssh -i key.pem -L 3001:127.0.0.1:3001 ubuntu@16.171.224.220
#   then open http://localhost:3001
#
# Deploy:
#   docker compose --env-file .env up -d --build
# ═══════════════════════════════════════════════════════════════════════════════

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-restart: &default-restart
  restart: unless-stopped

services:

  # ── PgBouncer — Connection Pooler (connects to host PostgreSQL) ─────────────
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: prodkb-pgbouncer
    <<: *default-restart
    logging: *default-logging
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DB_USER=${POSTGRES_USER:-prodkb}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - DB_HOST=${EXTERNAL_POSTGRES_HOST:-host.docker.internal}
      - DB_NAME=${POSTGRES_DB:-prodkb}
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=${PGBOUNCER_MAX_CLIENT_CONN:-1000}
      - DEFAULT_POOL_SIZE=${PGBOUNCER_DEFAULT_POOL_SIZE:-20}
      - ADMIN_USERS=${POSTGRES_USER:-prodkb}
      - AUTH_TYPE=scram-sha-256
    healthcheck:
      test: [ "CMD-SHELL", "nc -z 127.0.0.1 5432 || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - prodkb-network

  # ── Redis Cache ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: prodkb-redis
    <<: *default-restart
    logging: *default-logging
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: >
      sh -c 'redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"'
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prodkb-network

  # ── MinIO — S3-compatible object storage (PRIVATE: 127.0.0.1 only) ──────────
  minio:
    image: minio/minio:latest
    container_name: prodkb-minio
    <<: *default-restart
    logging: *default-logging
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9001:9001" # console — tunnel only
      - "127.0.0.1:9002:9000" # S3 API — tunnel only
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - prodkb-network

  # ── Auto-create default bucket on first startup (one-shot) ──────────────────
  minio-init:
    image: minio/mc:latest
    container_name: prodkb-minio-init
    restart: "no"
    logging: *default-logging
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
        mc mb --ignore-existing local/$${S3_BUCKET:-prodkb-uploads};
        exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      S3_BUCKET: ${S3_BUCKET:-prodkb-uploads}
    networks:
      - prodkb-network

  # ── Backend API (PRIVATE: reached only through the frontend proxy) ──────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: prodkb-backend
    <<: *default-restart
    logging: *default-logging
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # No public port. Frontend nginx proxies /api to backend:3000 over the
    # internal network. For direct local debugging, tunnel 127.0.0.1:3000.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - DIRECT_DATABASE_URL=${DIRECT_DATABASE_URL:?DIRECT_DATABASE_URL is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - FRONTEND_URL=${FRONTEND_URL:?FRONTEND_URL is required}
      - CORS_ORIGINS=${CORS_ORIGINS:?CORS_ORIGINS is required}
      - REDIS_URL=${REDIS_URL:?REDIS_URL is required}
      - SECURITY_MODE=${SECURITY_MODE:-}
      - NODE_ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SEED=${SEED:-false}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - S3_BUCKET=${S3_BUCKET:-prodkb-uploads}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      - S3_FORCE_PATH_STYLE=true
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - prodkb-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  # ── SLA Enforcement Worker ──────────────────────────────────────────────────
  sla-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: prodkb-sla-worker
    <<: *default-restart
    logging: *default-logging
    command: [ "node", "dist/src/workers/sla.worker.js" ]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      disable: true
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - DIRECT_DATABASE_URL=${DIRECT_DATABASE_URL:?DIRECT_DATABASE_URL is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - REDIS_URL=${REDIS_URL:?REDIS_URL is required}
      - NODE_ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - S3_BUCKET=${S3_BUCKET:-prodkb-uploads}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      - S3_FORCE_PATH_STYLE=true
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    networks:
      - prodkb-network

  # ── Webhook Delivery Worker ─────────────────────────────────────────────────
  webhook-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: prodkb-webhook-worker
    <<: *default-restart
    logging: *default-logging
    command: [ "node", "dist/src/workers/webhook.worker.js" ]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      disable: true
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - DIRECT_DATABASE_URL=${DIRECT_DATABASE_URL:?DIRECT_DATABASE_URL is required}
      - REDIS_URL=${REDIS_URL:?REDIS_URL is required}
      - NODE_ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    networks:
      - prodkb-network

  # ── Cleanup Worker (Token/Log rotation) ─────────────────────────────────────
  cleanup-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: prodkb-cleanup-worker
    <<: *default-restart
    logging: *default-logging
    command: [ "node", "dist/src/workers/cleanup.worker.js" ]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      disable: true
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - DIRECT_DATABASE_URL=${DIRECT_DATABASE_URL:?DIRECT_DATABASE_URL is required}
      - REDIS_URL=${REDIS_URL:?REDIS_URL is required}
      - NODE_ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    networks:
      - prodkb-network

  # ── Astreinte Notification Worker ───────────────────────────────────────────
  astreinte-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: prodkb-astreinte-worker
    <<: *default-restart
    logging: *default-logging
    command: [ "node", "dist/src/workers/astreinte.worker.js" ]
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      disable: true
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - DIRECT_DATABASE_URL=${DIRECT_DATABASE_URL:?DIRECT_DATABASE_URL is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - REDIS_URL=${REDIS_URL:?REDIS_URL is required}
      - FRONTEND_URL=${FRONTEND_URL:?FRONTEND_URL is required}
      - NODE_ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    networks:
      - prodkb-network

  # ── Frontend (Nginx) — THE ONLY PUBLIC SERVICE ─────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: prodkb-frontend
    <<: *default-restart
    logging: *default-logging
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - prodkb-network

  # ═══════════════════════════════════════════════════════════════════════════
  # Monitoring Stack — ALL PRIVATE (127.0.0.1, tunnel only)
  # ═══════════════════════════════════════════════════════════════════════════

  # ── Loki — Log aggregation ─────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.4.2
    container_name: prodkb-loki
    <<: *default-restart
    logging: *default-logging
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    networks:
      - prodkb-network

  # ── Promtail — Docker log collector → Loki ─────────────────────────────────
  promtail:
    image: grafana/promtail:3.4.2
    container_name: prodkb-promtail
    <<: *default-restart
    logging: *default-logging
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - prodkb-network

  # ── PostgreSQL Exporter ──────────────────────────────────────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: prodkb-postgres-exporter
    <<: *default-restart
    logging: *default-logging
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATA_SOURCE_NAME: ${POSTGRES_EXPORTER_DATA_SOURCE_NAME:-${DIRECT_DATABASE_URL:?DIRECT_DATABASE_URL is required}}
    networks:
      - prodkb-network

  # ── Redis Exporter ───────────────────────────────────────────────────────────
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: prodkb-redis-exporter
    <<: *default-restart
    logging: *default-logging
    environment:
      REDIS_ADDR: ${REDIS_URL:?REDIS_URL is required}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - prodkb-network

  # ── Node Exporter — server hardware metrics ─────────────────────────────────
  node-exporter:
    image: prom/node-exporter:latest
    container_name: prodkb-node-exporter
    <<: *default-restart
    logging: *default-logging
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - prodkb-network

  # ── Prometheus (PRIVATE: 127.0.0.1 only) ───────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: prodkb-prometheus
    <<: *default-restart
    logging: *default-logging
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - prodkb-network

  # ── Alertmanager (PRIVATE: 127.0.0.1 only) ─────────────────────────────────
  alertmanager:
    image: prom/alertmanager:latest
    container_name: prodkb-alertmanager
    <<: *default-restart
    logging: *default-logging
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - prodkb-network

  # ── Grafana (PRIVATE: 127.0.0.1 only) ───────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: prodkb-grafana
    <<: *default-restart
    logging: *default-logging
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:${GRAFANA_PORT:-3001}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - prodkb-network

networks:
  prodkb-network:
    driver: bridge

volumes:
  minio-data:
  redis-data:
  loki-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:
