# ─────────────────────────────────────────────────────────
#  ProdKB CI — lint → typecheck → build → test
#  Runs on every push/PR to main and develop
# ─────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ── Backend ─────────────────────────────────────────────
  backend:
    name: Backend (lint + build + test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: prodkb_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/prodkb_test?schema=public
      JWT_SECRET: ci-test-secret-minimum-16-chars
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # Generate Prisma client (needed before tsc)
      - run: npx prisma generate

      # TypeScript type-check (no emit)
      - name: Typecheck
        run: npx tsc --noEmit

      # Push schema to test DB & run tests
      - name: Migrate test DB
        run: npx prisma db push --skip-generate

      - name: Run tests
        run: npm test -- --ci --passWithNoTests --forceExit

  # ── Frontend ────────────────────────────────────────────
  frontend:
    name: Frontend (lint + build + test)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      NODE_OPTIONS: --max_old_space_size=4096

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck + Build
        run: npm run build

      - name: Run tests
        run: npm test -- --passWithNoTests --pool forks --no-file-parallelism

  # ── Docker build (verify images build successfully) ─────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t prodkb-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t prodkb-frontend:ci ./frontend
