name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # ── Backend ──
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: prodkb_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/prodkb_test?schema=public
      JWT_SECRET: ci-test-jwt-secret-that-is-long-enough-for-validation
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Cache Prisma client
        uses: actions/cache@v4
        with:
          path: backend/node_modules/.prisma
          key: ${{ runner.os }}-prisma-${{ hashFiles('backend/prisma/schema.prisma') }}

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests (quick on dev push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: npx jest --forceExit --testPathPatterns="health|auth|api"

      - name: Run tests with coverage (full on PR or main)
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/

  # ── Frontend ──
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    env:
      NODE_OPTIONS: '--max-old-space-size=4096'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests (quick on dev push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: npm test -- --reporter=verbose

      - name: Run tests (full on PR or main)
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        run: npm test

      - name: Build
        run: npm run build

  # ── E2E Tests ──
  e2e:
    name: E2E Playwright Tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Start services via Docker Compose
        run: docker compose up -d
        env:
          JWT_SECRET: ci-e2e-test-jwt-secret-long-enough-for-validation
          NODE_ENV: test

      - name: Wait for services
        run: |
          echo "Waiting for backend health check..."
          timeout 60s bash -c 'until curl -s http://localhost:3000/health; do sleep 2; done'
          echo "Backend is up and healthy!"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps

      - name: Run E2E Tests
        working-directory: ./frontend
        run: npx playwright test
        env:
          BASE_URL: http://localhost:8080

  # ── Docker Build ──
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t prodkb-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t prodkb-frontend:ci ./frontend
