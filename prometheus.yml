global:
  scrape_interval: 15s

rule_files:
  - "/etc/prometheus/rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prodkb-backend'
    static_configs:
      - targets: ['backend:3002']

  - job_name: 'prodkb-sla-worker'
    static_configs:
      - targets: ['sla-worker:3000']

  - job_name: 'prodkb-postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'prodkb-redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'prodkb-node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
