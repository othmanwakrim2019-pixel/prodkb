services:
  postgres:
    ports: []

  adminer:
    profiles: ["debug"]
    ports: []

  pgbouncer:
    ports: []

  redis:
    ports: []
    command: >
      sh -c 'if [ -n "$${REDIS_PASSWORD:-}" ]; then
        redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}";
      else
        redis-server --appendonly yes;
      fi'

  minio:
    ports: []
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}

  backend:
    ports: []
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}

  sla-worker:
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}

  webhook-worker:
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}

  cleanup-worker:
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}

  astreinte-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    dns: []
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}

  frontend:
    ports:
      - "${FRONTEND_PORT:-8080}:80"

  loki:
    ports: []

  node-exporter:
    ports: []

  prometheus:
    ports: []

  alertmanager:
    ports: []

  grafana:
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required}
