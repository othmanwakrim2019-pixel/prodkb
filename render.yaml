services:
  # ── Backend API (Web Service) ──
  - type: web
    name: prodkb-backend
    env: docker
    dockerContext: backend
    dockerfilePath: Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: prodkb-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: prodkb-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: SEED
        value: "true" # Set to true for the first deploy to seed the DB

  # ── SLA Enforcement Worker (Background Worker) ──
  - type: worker
    name: prodkb-sla-worker
    env: docker
    dockerContext: backend
    dockerfilePath: Dockerfile
    dockerCommand: node dist/src/workers/sla.worker.js
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: prodkb-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: prodkb-redis
          property: connectionString

  # ── Webhook Delivery Worker (Background Worker) ──
  - type: worker
    name: prodkb-webhook-worker
    env: docker
    dockerContext: backend
    dockerfilePath: Dockerfile
    dockerCommand: node dist/src/workers/webhook.worker.js
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: prodkb-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: prodkb-redis
          property: connectionString

  # ── Frontend (Web Service) ──
  - type: web
    name: prodkb-frontend
    env: docker
    dockerContext: frontend
    dockerfilePath: Dockerfile
    plan: starter
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: prodkb-backend
          property: host

# ── Databases ──
databases:
  - name: prodkb-db
    plan: starter
    postgresContext:
      name: prodkb

# ── Redis (Cache & BullMQ) ──
redis:
  - name: prodkb-redis
    plan: starter
